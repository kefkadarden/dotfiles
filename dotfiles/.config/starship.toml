"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

# ---------------------------------------------------------------------------
# Line 1 (left): [os][shell] [status] [cmd_duration] ...fill... [git] (right)
# Line 2:        tl-dash  heart HH:MM | [root]  path
# Line 3:        bl-dash  chevron
# ---------------------------------------------------------------------------
# format = """
# $os\
# $shell\
# [\ue0b0](fg:#FEF5ED bg:#516BEB)\
# $status\
# [\ue0b0](fg:#516BEB bg:#575656)\
# $cmd_duration\
# [\ue0b0](fg:#575656)\
# $fill\
# ${custom.git_clean}\
# ${custom.git_dirty}\
# ${custom.git_ahead}\
# ${custom.git_behind}\
# ${custom.git_diverged}\
# $line_break\
# [\u256d\u2500](fg:#FEF5ED)\
# $time\
# ${custom.root}\
# $directory\
# $line_break\
# [\u2570\u2500 ](fg:#FEF5ED)$character"""

format = """$os$shell[\ue0b0](fg:#FEF5ED bg:#516BEB)$status[\ue0b0](fg:#516BEB bg:#575656)$cmd_duration[\ue0b0](fg:#575656)$fill${custom.git_clean}${custom.git_dirty}${custom.git_ahead}${custom.git_behind}${custom.git_diverged} $line_break[\u256d\u2500](fg:#FEF5ED)$time${custom.root}$directory$line_break[\u2570\u2500 ](fg:#FEF5ED)$character"""

[shell]
disabled = false
format = '[ $indicator ]($style)'
style = 'fg:#011627 bg:#FEF5ED'
bash_indicator = 'bash'
zsh_indicator = 'zsh'
fish_indicator = 'fish'
powershell_indicator = 'pwsh'
cmd_indicator = 'cmd'
nu_indicator = 'nu'
unknown_indicator = 'sh'

[os]
disabled = false
format = '[ $symbol]($style)'
style = 'fg:#011627 bg:#FEF5ED'

[os.symbols]
Macos = "\uf179 "
Ubuntu = "\uf31b "
Windows = "\uf17a "
Linux = "\uf17c "
Arch = "\uf303 "
Debian = "\uf306 "
Fedora = "\uf30a "
Alpine = "\uf300 "

[status]
disabled = false
format = '[ $symbol ]($style)'
style = 'fg:#ffffff bg:#516BEB'
symbol = "\uf071"
success_symbol = "\uf00c"
not_executable_symbol = "\uf05e"
not_found_symbol = "\uf002"
sigint_symbol = "\uf28b"
signal_symbol = "\uf0e7"

[cmd_duration]
min_time = 0
show_milliseconds = true
format = '[ $duration ]($style)'
style = 'fg:#d6deeb bg:#575656'

[fill]
symbol = ' '

[time]
disabled = false
format = "[ \u2665 $time |]($style)"
time_format = '%R'
style = 'fg:#FEF5ED'

[directory]
format = "[ \uf07b $path ]($style)"
style = 'fg:#FEF5ED'
home_symbol = "\uf015 "
read_only = " \uf023 "
truncation_length = 0
truncate_to_repo = false

[character]
success_symbol = "[\u276f](bold fg:#17D7A0)"
error_symbol = "[\u276f](bold fg:#e91e63)"

[custom.root]
description = 'Crown shown only when running as root'
command = "printf '\uf0a3 '"
when = '''[ "$(id -u 2>/dev/null)" = "0" ]'''
format = '[$output]($style)'
style = 'fg:#FEF5ED'

[custom.git_clean]
when = '''[ "$(bash "$HOME/.config/starship/gitseg.sh" state)" = clean ]'''
command = 'bash "$HOME/.config/starship/gitseg.sh" render'
format = "[\ue0b2](fg:#17D7A0)[ $output ](fg:#011627 bg:#17D7A0)"

[custom.git_dirty]
when = '''[ "$(bash "$HOME/.config/starship/gitseg.sh" state)" = dirty ]'''
command = 'bash "$HOME/.config/starship/gitseg.sh" render'
format = "[\ue0b2](fg:#FF9248)[ $output ](fg:#011627 bg:#FF9248)"

[custom.git_ahead]
when = '''[ "$(bash "$HOME/.config/starship/gitseg.sh" state)" = ahead ]'''
command = 'bash "$HOME/.config/starship/gitseg.sh" render'
format = "[\ue0b2](fg:#B388FF)[ $output ](fg:#011627 bg:#B388FF)"

[custom.git_behind]
when = '''[ "$(bash "$HOME/.config/starship/gitseg.sh" state)" = behind ]'''
command = 'bash "$HOME/.config/starship/gitseg.sh" render'
format = "[\ue0b2](fg:#B388FF)[ $output ](fg:#011627 bg:#B388FF)"

[custom.git_diverged]
when = '''[ "$(bash "$HOME/.config/starship/gitseg.sh" state)" = diverged ]'''
command = 'bash "$HOME/.config/starship/gitseg.sh" render'
format = "[\ue0b2](fg:#ff4500)[ $output ](fg:#011627 bg:#ff4500)"
